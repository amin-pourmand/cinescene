name: Validate CineScene PWA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static PWA files
        run: |
          test -f docs/index.html
          test -f docs/manifest.webmanifest
          test -f docs/sw.js
          test -f docs/assets/app.js
          test -f docs/assets/styles.css
          test -f docs/assets/lucide.min.js
          test -f docs/assets/manrope-latin.woff2
          test -f docs/assets/vazirmatn-arabic.woff2
          test -f docs/assets/scene-explorer.js
          test -f docs/assets/scene-explorer.css
          test -f docs/assets/brand-mark.svg
          test -f docs/assets/icon-192.png
          test -f docs/assets/icon-512.png
          test -f docs/assets/icon-maskable-512.png
          test -f docs/assets/apple-touch-icon.png
          test -f docs/data/catalog.sample.json
          python -m json.tool docs/manifest.webmanifest > /dev/null
          python -m json.tool docs/data/catalog.sample.json > /dev/null

      - name: Validate browser JavaScript
        run: |
          node --check docs/assets/app.js
          node --check docs/sw.js
          node --check docs/assets/scene-explorer.js
          node --check frontend/assets/app.js

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API and subtitle test dependencies
        run: python -m pip install fastapi python-multipart httpx python-dotenv "pysubs2>=1.8,<2"
      - name: Verify scene workflows without model downloads
        run: python -m unittest discover -s tests -v
